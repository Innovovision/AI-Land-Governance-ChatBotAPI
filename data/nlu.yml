- intent: lpc_check
  examples: |
    - 3
    - lpc
    - can I get LPC
    - land possession certificate
    - एलपीसी
    - lpc banwana hai
- intent: lodge_grievance
  examples: |
    - 4
    - complaint
    - lodge grievance
    - I want to complain
    - शिकायत
    - shikayat darj karni hai
- intent: parimarjan_help
  examples: |
    - 5
    - parimarjan
    - correction in jamabandi
    - my name is wrong in record
    - परिमार्जन
    - galti sudhar
    - parimarjan status
    - where is my correction application
    - परिमार्जन की स्थिति
- intent: ask_assistant
  examples: |
    - 6
    - I have a question
    - ask a question
    - help
    - सवाल पूछना है
    - prashn
